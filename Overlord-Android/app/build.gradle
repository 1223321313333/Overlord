plugins {
    id 'com.android.application'
}

android {
    namespace 'com.overlord.agent'
    compileSdk 34

    defaultConfig {
        applicationId "com.overlord.agent"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Disable splits — we want a fat APK with the agent binary inside
    splits {
        abi {
            enable false
        }
    }
}

dependencies {
}
